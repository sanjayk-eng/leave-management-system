services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8082/api
    image: leave-management-frontend:latest
    container_name: leave-management-frontend
    ports:
      - "8089:8089"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
